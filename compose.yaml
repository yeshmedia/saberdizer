services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-saberdizer}
      DB_USER: ${DB_USER:-saberdizer_app}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-saberdizer}
      MARIADB_USER: ${DB_USER:-saberdizer_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/001_leads.sql:/docker-entrypoint-initdb.d/001_leads.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
